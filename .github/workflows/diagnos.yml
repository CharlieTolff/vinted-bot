name: Diagnos av börsen

# Startas för hand. Skriver ut hur börsens mätningar ser ut i loggen. Sparar aldrig något tillbaka,
# så "provkor" kan prova nya mätningar på riktiga data utan att röra börsen.
on:
  workflow_dispatch:
    inputs:
      steg:
        description: "diagnos = visa det sparade, provkor = mät en runda först (sparas inte), tradera = hur aktiva annonser hämtas, brevo = väntelistans formulär hos Brevo, doman = svarar märkesbörsen.se för besökare"
        default: diagnos
        type: choice
        options: [diagnos, provkor, tradera, brevo, doman]

permissions:
  contents: read

jobs:
  diagnos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            bors.json
            tradera_salda.json
            spaning.json
            spaning_minne.json
          key: bors-${{ github.run_id }}
          restore-keys: bors-
      - uses: actions/cache/restore@v4
        with:
          path: tradera_affarer.json
          key: affarer-${{ github.run_id }}
          restore-keys: affarer-
      - name: Mät en runda (sparas inte)
        if: inputs.steg == 'provkor'
        run: python3 marknad.py --sekunder 420
      - name: Traderas aktiva annonser
        if: inputs.steg == 'tradera'
        run: python3 diagnos.py --tradera
      - name: Väntelistans formulär hos Brevo
        if: inputs.steg == 'brevo'
        env:
          BREVO_KEY: ${{ secrets.BREVO_KEY }}
        run: |
          H="api-key: $BREVO_KEY"
          echo "== Konto"; curl -s -H "$H" https://api.brevo.com/v3/account | jq -c '{plan: [.plan[]?.type], relay: .relay.enabled, fel: .code}'
          echo "== Avsändare"; curl -s -H "$H" https://api.brevo.com/v3/senders | jq -c '.senders[]? | {email, active}'
          echo "== Domäner"; curl -s -H "$H" https://api.brevo.com/v3/senders/domains | jq -c '.domains[]? | {domain_name, authenticated, verified}'
          echo "== Händelser"; curl -s -H "$H" "https://api.brevo.com/v3/smtp/statistics/events?limit=20&days=1&email=markesborsen@gmail.com" | jq -c '(.events[]? | {date, event, subject, reason, from}), (if .code then . else empty end)'
      - name: Svarar märkesbörsen.se
        if: inputs.steg == 'doman'
        run: |
          for namn in xn--mrkesbrsen-q5a5t.se www.xn--mrkesbrsen-q5a5t.se; do
            echo "== DNS $namn"; dig +short A "$namn"; dig +short CNAME "$namn"
          done
          for url in http://xn--mrkesbrsen-q5a5t.se/ https://xn--mrkesbrsen-q5a5t.se/ https://www.xn--mrkesbrsen-q5a5t.se/ https://xn--mrkesbrsen-q5a5t.se/vantelista/ https://charlietolff.github.io/vinted-bot/; do
            echo "== $url"; curl -sS -m 20 -o /dev/null -w "HTTP %{http_code} -> %{redirect_url}\n" "$url" || true
          done
          echo "== Certifikat"; echo | openssl s_client -connect xn--mrkesbrsen-q5a5t.se:443 -servername xn--mrkesbrsen-q5a5t.se 2>/dev/null | openssl x509 -noout -subject -issuer -dates || echo "inget certifikat"
      - name: Diagnos
        if: inputs.steg != 'tradera' && inputs.steg != 'brevo' && inputs.steg != 'doman'
        run: python3 diagnos.py --dump
