name: Diagnos av börsen

# Startas för hand. Skriver ut hur börsens mätningar ser ut i loggen. Sparar aldrig något tillbaka,
# så "provkor" kan prova nya mätningar på riktiga data utan att röra börsen.
on:
  workflow_dispatch:
    inputs:
      steg:
        description: "diagnos = visa det sparade, provkor = mät en runda först (sparas inte), tradera = hur aktiva annonser hämtas, brevo = väntelistans formulär hos Brevo"
        default: diagnos
        type: choice
        options: [diagnos, provkor, tradera, brevo]

permissions:
  contents: read

jobs:
  diagnos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            bors.json
            tradera_salda.json
            spaning.json
            spaning_minne.json
          key: bors-${{ github.run_id }}
          restore-keys: bors-
      - uses: actions/cache/restore@v4
        with:
          path: tradera_affarer.json
          key: affarer-${{ github.run_id }}
          restore-keys: affarer-
      - name: Mät en runda (sparas inte)
        if: inputs.steg == 'provkor'
        run: python3 marknad.py --sekunder 420
      - name: Traderas aktiva annonser
        if: inputs.steg == 'tradera'
        run: python3 diagnos.py --tradera
      - name: Väntelistans formulär hos Brevo
        if: inputs.steg == 'brevo'
        run: |
          url=$(grep -o 'const BREVO_FORM = "[^"]*"' hemsida/vantelista.html | cut -d'"' -f2)
          curl -sS -m 30 "$url" -o brevo.html -w "HTTP %{http_code}\n"
          grep -oE '<form[^>]*>' brevo.html || true
          grep -oE '<(input|select)[^>]*>' brevo.html | sed -E 's/ (class|style|placeholder|data-[a-z-]+)="[^"]*"//g' || true
      - name: Diagnos
        if: inputs.steg != 'tradera' && inputs.steg != 'brevo'
        run: python3 diagnos.py --dump
