name: Bevaka Vinted

on:
  schedule:
    - cron: "*/5 * * * *"   # var 5:e minut (GitHub kan ibland vara några minuter sen)
  workflow_dispatch:         # gör att du kan starta den för hand under fliken Actions
  push:
    branches: [main]         # kör direkt när alarmen ändras

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bevaka
  cancel-in-progress: false

jobs:
  bevaka:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      # sedda.json minns vilka annonser du redan fått, traffar.json är det hemsidan visar,
      # minne.json minns priser (för vanligt pris), säljare och märken
      - uses: actions/cache/restore@v4
        with:
          path: |
            sedda.json
            traffar.json
            minne.json
          key: minne-${{ github.run_id }}
          restore-keys: minne-

      # bors.json är märkesbörsens historik, tradera_salda.json de sålda Tradera-annonser den sett
      - uses: actions/cache/restore@v4
        with:
          path: |
            bors.json
            tradera_salda.json
            spaning.json
            spaning_minne.json
          key: bors-${{ github.run_id }}
          restore-keys: bors-

      # tradera_affarer.json: alla sålda och osålda Tradera-annonser i börsens kategorier (egen cache, så att
      # börsens övriga filer hittas som förut)
      - uses: actions/cache/restore@v4
        with:
          path: tradera_affarer.json
          key: affarer-${{ github.run_id }}
          restore-keys: affarer-

      # Bildkollen: den gratis bildmodellen (CLIP) sparas mellan körningarna så den bara laddas ner en gång.
      - uses: actions/cache@v4
        with:
          path: .bildmodell
          key: bildmodell-clip-vit-b-32

      # Fixa bilder på hemsidan: bildmodellerna krymps en gång och sparas mellan körningarna.
      - uses: actions/cache@v4
        with:
          path: .fixabild
          key: fixabild-modeller-2-${{ hashFiles('clip_etiketter.py') }}

      - name: Förbered bildmodellerna till Fixa bilder
        continue-on-error: true
        timeout-minutes: 8
        run: |
          mkdir -p .fixabild
          for m in isnet-general-use u2net_human_seg; do
            if [ ! -s .fixabild/$m.onnx ]; then
              curl -sSfL -o /tmp/$m.onnx https://github.com/danielgatis/rembg/releases/download/v0.0.0/$m.onnx
              python3 -m pip install --quiet numpy
              python3 krymp_modell.py /tmp/$m.onnx /tmp/$m-liten.onnx && mv /tmp/$m-liten.onnx .fixabild/$m.onnx
            fi
          done
          # AI:n som känner igen plagget i Skriv beskrivning (CLIP, samma som bildkollen).
          if [ ! -s .fixabild/clip-bild.onnx ] || [ ! -s .fixabild/clip-etiketter.json ]; then
            python3 -m pip install --quiet numpy fastembed
            python3 clip_etiketter.py .fixabild
          fi

      - name: Installera bildkollen
        continue-on-error: true
        timeout-minutes: 3
        run: python3 -m pip install --quiet fastembed anthropic

      - name: Sök på Vinted och skicka kap till Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 vinted_bot.py --en-gang

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            sedda.json
            traffar.json
            minne.json
          key: minne-${{ github.run_id }}

      # Märkesbörsen mäter en stund efter varje runda. Krånglar den påverkas inte alarmen.
      - name: Mät märken till märkesbörsen
        continue-on-error: true
        timeout-minutes: 8   # börsen mäter i 4 minuter, plus marginal för sista mätningen och sammanställningen
        run: python3 marknad.py

      # Dina egna börsanalyser (filtren på börssidan), med bildjämförelse om de har bilder
      - name: Egna börsanalyser
        continue-on-error: true
        timeout-minutes: 5
        run: python3 spaning.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            bors.json
            tradera_salda.json
            spaning.json
            spaning_minne.json
          key: bors-${{ github.run_id }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: tradera_affarer.json
          key: affarer-${{ github.run_id }}

      # Bokföringen krypteras med ditt lösenord, eftersom hemsidan är öppen för alla som har länken
      - name: Hämta bokföringen
        continue-on-error: true
        env:
          BOKFORING_ARK: ${{ secrets.BOKFORING_ARK }}
          BOKFORING_LOSEN: ${{ secrets.BOKFORING_LOSEN }}
        run: python3 bokforing.py

      - name: Bygg hemsidan
        run: |
          mkdir -p _site
          cp hemsida/index.html hemsida/bors.html hemsida/bokforing.html hemsida/stil.css hemsida/fixabild.js hemsida/bokfor.js hemsida/annons.js sokningar.json _site/
          mkdir -p _site/modeller
          cp .fixabild/*.onnx .fixabild/*.json _site/modeller/ 2>/dev/null || true
          cp -r exempelbilder _site/ 2>/dev/null || true
          cp bokforing.enc _site/ 2>/dev/null || cp hemsida/bokforing.enc _site/
          cp traffar.json _site/ 2>/dev/null || echo "{}" > _site/traffar.json
          cp bors.json _site/ 2>/dev/null || echo "{}" > _site/bors.json
          cp spaning.json _site/ 2>/dev/null || echo "{}" > _site/spaning.json
          cp spaningar.json _site/
          cp borskategorier.json _site/ 2>/dev/null || echo "[]" > _site/borskategorier.json
          # Den publika börsen: en startsida och börsen utan alarm och egna analyser.
          mkdir -p _site/borsen
          cp hemsida/borsen.html _site/borsen/index.html
          cp hemsida/bors.html _site/borsen/app.html
          cp hemsida/stil.css hemsida/fixabild.js hemsida/bokfor.js hemsida/annons.js _site/borsen/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
