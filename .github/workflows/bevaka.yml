name: Bevaka Vinted

on:
  schedule:
    - cron: "*/5 * * * *"   # var 5:e minut (GitHub kan ibland vara några minuter sen)
  workflow_dispatch:         # gör att du kan starta den för hand under fliken Actions
  push:
    branches: [main]         # kör direkt när alarmen ändras

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bevaka
  cancel-in-progress: false

jobs:
  bevaka:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      # sedda.json minns vilka annonser du redan fått, traffar.json är det hemsidan visar,
      # minne.json minns priser (för vanligt pris), säljare och märken
      - uses: actions/cache/restore@v4
        with:
          path: |
            sedda.json
            traffar.json
            minne.json
          key: minne-${{ github.run_id }}
          restore-keys: minne-

      # bors.json är märkesbörsens historik, tradera_salda.json de sålda Tradera-annonser den sett
      - uses: actions/cache/restore@v4
        with:
          path: |
            bors.json
            tradera_salda.json
          key: bors-${{ github.run_id }}
          restore-keys: bors-

      # Bildkollen (en AI som tittar på annonsbilderna) används bara om nyckeln ANTHROPIC_API_KEY finns.
      # Bildkollen: den gratis bildmodellen (CLIP) sparas mellan körningarna så den bara laddas ner en gång.
      - uses: actions/cache@v4
        with:
          path: .bildmodell
          key: bildmodell-clip-vit-b-32

      - name: Installera bildkollen
        continue-on-error: true
        timeout-minutes: 3
        run: python3 -m pip install --quiet fastembed anthropic

      - name: Sök på Vinted och skicka kap till Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 vinted_bot.py --en-gang

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            sedda.json
            traffar.json
            minne.json
          key: minne-${{ github.run_id }}

      # Märkesbörsen mäter en stund efter varje runda. Krånglar den påverkas inte alarmen.
      - name: Mät märken till märkesbörsen
        continue-on-error: true
        timeout-minutes: 7   # börsen mäter i 4 minuter, plus marginal för sista mätningen
        run: python3 marknad.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            bors.json
            tradera_salda.json
          key: bors-${{ github.run_id }}

      # Bokföringen krypteras med ditt lösenord, eftersom hemsidan är öppen för alla som har länken
      - name: Hämta bokföringen
        continue-on-error: true
        env:
          BOKFORING_ARK: ${{ secrets.BOKFORING_ARK }}
          BOKFORING_LOSEN: ${{ secrets.BOKFORING_LOSEN }}
        run: python3 bokforing.py

      - name: Bygg hemsidan
        run: |
          mkdir -p _site
          cp hemsida/index.html hemsida/bors.html hemsida/bokforing.html hemsida/stil.css sokningar.json _site/
          cp bokforing.enc _site/ 2>/dev/null || cp hemsida/bokforing.enc _site/
          cp traffar.json _site/ 2>/dev/null || echo "{}" > _site/traffar.json
          cp bors.json _site/ 2>/dev/null || echo "{}" > _site/bors.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
