name: Testa nya larm (research)

on:
  push:
    branches: [claude/resell-research-larm-fboog9]
    paths: ["research/test_nya.py", ".github/workflows/testnya.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m research.test_nya
