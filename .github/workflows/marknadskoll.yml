name: Marknadskoll (research)

on:
  push:
    branches: [claude/resell-research-larm-fboog9]
    paths: ["research/**", ".github/workflows/marknadskoll.yml"]

permissions:
  contents: read

jobs:
  koll:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Kör research
        run: |
          python3 research/probe.py 2>&1 | tee research-out.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-out
          path: research-out.txt
