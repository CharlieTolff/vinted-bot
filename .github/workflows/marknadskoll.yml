name: Marknadskoll (research)

on:
  push:
    branches: [claude/resell-research-larm-fboog9]
    paths: ["research/**.py", ".github/workflows/marknadskoll.yml"]

permissions:
  contents: write

jobs:
  koll:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Runda 2
        continue-on-error: true
        run: python3 -m research.runda2
      - name: Spara resultatet i grenen
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f research/*.json || true
          git commit -m "Research-resultat" || exit 0
          git push
